name: Bug report / گزارش خطا
description: Report a reproducible problem in public code or documentation (no security disclosures).
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Security vulnerabilities must be reported privately through SECURITY.md. Never share secrets or private data."
  - type: textarea
    id: problem
    attributes:
      label: Problem / شرح مشکل
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / مراحل بازتولید
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / نتیجه مورد انتظار
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / نسخه
